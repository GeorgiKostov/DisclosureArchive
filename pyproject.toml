[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ufo-release-index"
version = "0.1.0"
description = "Local indexing and search tooling for UFO release archives."
requires-python = ">=3.9"
dependencies = [
  "fastembed>=0.4.2",
  "numpy>=1.24",
  "pdfplumber>=0.11",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
